<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#260808">
<title>Repositories</title>
<style>
:root{color-scheme:dark;--bg:#210707;--panel:#300b0b;--line:#552020;--text:#eee7e7;--muted:#c7aaaa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(680px,92%);margin:48px auto;padding-bottom:40px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
a{color:var(--text);text-decoration:none;overflow-wrap:anywhere}
a:hover{text-decoration:underline}
button{flex-shrink:0;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#431010}
@media(max-width:420px){main{margin-top:24px}li{gap:8px}button{padding:6px 8px}}
</style>
</head>
<body>
<main>
<ul>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/MatthewClicker-MC/">MatthewClicker-MC</a><button type="button" data-url="https://mtyt7.github.io/MatthewClicker-MC/">Copy link</button></li>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/Test-2/">Test-2</a><button type="button" data-url="https://mtyt7.github.io/Test-2/">Copy link</button></li>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/MC-UPDATED/">MC UPDATED</a><button type="button" data-url="https://mtyt7.github.io/MC-UPDATED/">Copy link</button></li>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/Test3/">Test3</a><button type="button" data-url="https://mtyt7.github.io/Test3/">Copy link</button></li>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/MC1/">MC1</a><button type="button" data-url="https://mtyt7.github.io/MC1/">Copy link</button></li>
<li><a target="_blank" rel="noopener noreferrer" href="https://mtyt7.github.io/MatthewMediaMM/">MatthewMediaMM</a><button type="button" data-url="https://mtyt7.github.io/MatthewMediaMM/">Copy link</button></li>
</ul>
</main>
<script>
document.querySelectorAll("button[data-url]").forEach(button=>{
  button.addEventListener("click",async()=>{
    const url=button.dataset.url;
    try{
      await navigator.clipboard.writeText(url);
      button.textContent="Copied";
      setTimeout(()=>button.textContent="Copy link",1200);
    }catch{
      const field=document.createElement("textarea");
      field.value=url;
      field.style.position="fixed";
      field.style.opacity="0";
      document.body.appendChild(field);
      field.select();
      const ok=document.execCommand("copy");
      field.remove();
      button.textContent=ok?"Copied":"Copy failed";
      setTimeout(()=>button.textContent="Copy link",1200);
    }
  });
});
</script>
</body>
</html>
